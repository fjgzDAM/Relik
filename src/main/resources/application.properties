spring.application.name=Arquealia

# Configuración de la base de datos para MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/BArquealia
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Use a random available port to avoid conflicts during development
server.port=0

