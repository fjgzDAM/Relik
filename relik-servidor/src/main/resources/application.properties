spring.application.name=Relik

# Configuración de la base de datos para MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/BRelik?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Puerto del servidor
server.port=8080

# Deshabilitar el UI en el servidor (solo backend REST)
spring.profiles.active=server
